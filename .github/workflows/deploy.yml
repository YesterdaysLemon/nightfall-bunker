name: "Validate and deploy Nightfall Bunker"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: "Upload the edge Worker even if its code did not change (restarts live lobbies and matches)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # the Worker step diffs against the previous main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit and network tests
        run: |
          set -euo pipefail
          npm run check
          npm test
      - name: Build client and edge worker
        run: |
          set -euo pipefail
          npm run build
          npm run build:worker
          test -s dist/index.html
          test -s dist-worker/index.js
      - name: Smoke-test the origin server
        run: |
          set -euo pipefail
          PORT=8099 node server/index.mjs &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8099/healthz >/dev/null && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:8099/healthz | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:8099/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/.git/config)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8099/net/party)" = "200"
      - name: Headless play-through (round 1)
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium-headless-shell webkit
          npm run smoke
          npm run touch-smoke
          npm run ios-smoke
          npm run hounds-smoke
          npm run audio-check
      - name: Keep smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-screenshots
          path: output/smoke/
          if-no-files-found: ignore
      - name: Notify Deploy Manager
        if: >-
          vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_EVENT: push
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_WEBHOOK_URL"
          test -n "$DEPLOY_WEBHOOK_SECRET"
          payload="$(node -e 'const p={event:process.env.DEPLOY_EVENT,branch:process.env.DEPLOY_BRANCH,repo:process.env.DEPLOY_REPOSITORY,sha:process.env.DEPLOY_SHA};process.stdout.write(JSON.stringify(p))')"
          signature="$(node -e 'const c=require("crypto");process.stdout.write("sha256="+c.createHmac("sha256",process.env.DEPLOY_WEBHOOK_SECRET).update(process.argv[1]).digest("hex"))' "$payload")"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$DEPLOY_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: $DEPLOY_EVENT" \
            --header "X-Hub-Signature-256: $signature" \
            --data "$payload")"
          job_id="$(node -e 'const r=JSON.parse(process.argv[1]);if(r.skipped){console.error("Deploy Manager skipped request; verify repository, branch and event allowlist");process.exit(1)}if(!r.job?.id||!r.receipt){console.error("Deploy Manager returned no job receipt");process.exit(1)}if(r.job.sha!==process.env.DEPLOY_SHA){console.error("Deploy Manager accepted SHA mismatch");process.exit(1)}process.stdout.write(r.job.id)' "$response")"
          receipt_url="$(node -e 'const r=JSON.parse(process.argv[1]);const w=new URL(process.argv[2]);const u=new URL(r.receipt,w.origin);if(u.origin!==w.origin||u.pathname!=="/api/releases/"+r.job.id){console.error("Invalid Deploy Manager receipt URL");process.exit(1)}process.stdout.write(u.href)' "$response" "$DEPLOY_WEBHOOK_URL")"
          echo "Deploy Manager accepted job $job_id (duplicates reuse the original receipt)"
          for attempt in $(seq 1 600); do
            job="$(curl --fail-with-body --silent --show-error --max-time 30 "$receipt_url")"
            status="$(node -e 'const r=JSON.parse(process.argv[1]);if(r.job?.id!==process.argv[2]){console.error("Deploy Manager receipt identity mismatch");process.exit(1)}process.stdout.write(r.job.status??"unknown")' "$job" "$job_id")"
            case "$status" in
              succeeded) echo "Deploy Manager job $job_id succeeded"; exit 0 ;;
              failed|rolled-back|interrupted) echo "Deploy Manager job $job_id ended with $status" >&2; exit 1 ;;
              queued|running) ;;
              *) echo "Deploy Manager job $job_id has unknown status: $status" >&2; exit 1 ;;
            esac
            sleep 2
          done
          echo "Deploy Manager job $job_id exceeded the receipt polling limit" >&2
          exit 1
      # The edge Worker (lobbies and matches on Cloudflare) ships right after the
      # site is live, so a PROTOCOL change reaches both within a minute. Uploading it
      # restarts every live lobby and match, so it only ships when its code or config
      # changed (or on a manual run with deploy_worker).
      - name: Decide whether the edge Worker changed
        id: worker
        if: >-
          vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker }}
        run: |
          set -euo pipefail
          protocol() { git show "$1:src/shared/protocol.js" 2>/dev/null | grep -o 'PROTOCOL = [0-9]*' || true; }
          if [ "$FORCE" = "true" ]; then
            changed=true; bumped=false
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=true; bumped=false   # no earlier commit to compare with
          else
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- worker src/net src/shared wrangler.jsonc; then changed=false; else changed=true; fi
            if [ "$(protocol "$BEFORE")" = "$(protocol "$GITHUB_SHA")" ]; then bumped=false; else bumped=true; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "protocol_bumped=$bumped" >> "$GITHUB_OUTPUT"
          echo "Edge Worker changed: $changed (PROTOCOL bumped: $bumped)"
      - name: Deploy the edge Worker
        if: steps.worker.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROTOCOL_BUMPED: ${{ steps.worker.outputs.protocol_bumped }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ "$PROTOCOL_BUMPED" = "true" ]; then
              echo "::error::PROTOCOL changed but the Cloudflare token or account id is not configured: multiplayer stays broken until the edge Worker is uploaded."
              exit 1
            fi
            echo "::warning::The edge Worker changed but CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured, so it was not uploaded."
            exit 0
          fi
          npx --yes wrangler@4.142.0 deploy --minify
      - name: Check the live site and edge
        if: steps.worker.outcome == 'success'
        env:
          SITE: ${{ vars.SITE_URL || 'https://zombies.alirezaafshan.com' }}
        run: |
          set -euo pipefail
          curl -fsS "$SITE/healthz" | grep -q "\"sha\":\"$GITHUB_SHA\""
          curl -fsS "$SITE/net/health" | grep -q '"edge":true'
          node scripts/mp-smoke.mjs --url "$SITE"
